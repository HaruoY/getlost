<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Radicale</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; padding: 10px; margin: 0; }
        #console { background: #000; border: 1px solid #333; height: 180px; overflow-y: scroll; padding: 10px; font-size: 12px; margin-bottom: 10px; border-radius: 5px; }
        .log-info { color: #00ffcc; }
        .log-err { color: #ff5555; }
        .log-succ { color: #55ff55; }
        button { width: 100%; padding: 15px; background: #00adb5; border: none; color: white; font-weight: bold; border-radius: 5px; font-size: 16px; margin-bottom: 10px; }
        #app-core { display: none; text-align: center; }
        #arrow { width: 150px; height: 150px; transition: transform 0.1s; margin: 20px auto; }
        input { width: 70%; padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <h3>LOG DI SISTEMA:</h3>
    <div id="console">In attesa dell'azione utente...</div>

    <button id="btn-avvia" onclick="forzaAvvio()">FORZA AVVIO E DIAGNOSTICA</button>

    <div id="app-core">
        <input type="text" id="target" placeholder="Scrivi una città...">
        <button style="width:20%; padding:10px; display:inline-block;" onclick="cerca()">Vai</button>
        <div id="arrow">
            <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
                <polygon points="50,5 95,95 50,75 5,95" fill="#00adb5" />
            </svg>
        </div>
        <div id="dist">-- km</div>
    </div>

    <script>
        function log(testo, tipo="info") {
            const con = document.getElementById('console');
            let classe = "log-info";
            if(tipo === "err") classe = "log-err";
            if(tipo === "succ") classe = "log-succ";
            con.innerHTML += `<div class="${classe}">> ${testo}</div>`;
            con.scrollTop = con.scrollHeight;
        }

        window.onerror = function(msg, url, line) {
            log(`ERRORE CRASH: ${msg} alla linea ${line}`, "err");
            return false;
        };

        log("Pagina caricata correttamente.");

        function forzaAvvio() {
            log("Pulsante premuto. Avvio diagnostica...");
            document.getElementById('btn-avvia').style.display = 'none';
            document.getElementById('app-core').style.display = 'block';

            // 1. TEST GPS
            if (!navigator.geolocation) {
                log("ERRORE: Il browser non ha l'oggetto Geolocation!", "err");
            } else {
                log("Tentativo di aggancio GPS in corso...", "info");
                navigator.geolocation.watchPosition(
                    (p) => {
                        log(`GPS OK! Lat: ${p.coords.latitude.toFixed(4)}, Lon: ${p.coords.longitude.toFixed(4)}`, "succ");
                    },
                    (e) => {
                        log(`ERRORE GPS hardware: Codice ${e.code} - ${e.message}`, "err");
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            }

            // 2. TEST BUSSOLA
            log("Verifica sensori orientamento...", "info");
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                log("Rilevato sistema iOS (iPhone). Richiedo permesso...", "info");
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if(state === 'granted') {
                            log("Bussola iOS: PERMESSO ACCETTATO", "succ");
                            attivaBussola();
                        } else {
                            log("Bussola iOS: PERMESSO NEGATO", "err");
                        }
                    }).catch(err => log("Errore promessa iOS: " + err, "err"));
            } else {
                log("Rilevato sistema standard (Android o PC). Attivo sensori...", "info");
                attivaBussola();
            }
        }

        function attivaBussola() {
            window.addEventListener('deviceorientationabsolute', (e) => {
                let h = e.webkitCompassHeading || (360 - e.alpha);
                log(`Dati bussola ricevuti: ${h.toFixed(0)}°`, "succ");
            }, {once: true}); // Logga solo la prima volta per non intasare
        }

        function cerca() {
            log("Tentativo di ricerca sul server OpenStreetMap...", "info");
            // Logica minima di test per la ricerca
            log("Usa una destinazione reale per calcolare i km.", "info");
        }
    </script>
</body>
</html>
