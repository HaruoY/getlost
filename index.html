<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigatore GPS Minimal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-main {
            padding: 20px 40px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
        }
        #search-container {
            position: absolute;
            top: 20px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .search-row {
            display: flex;
            gap: 5px;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #1e1e1e;
            color: white;
            font-size: 16px;
        }
        .btn-search {
            padding: 12px 20px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #suggestions {
            background-color: #1e1e1e;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #suggestions li {
            padding: 12px;
            border-bottom: 1px solid #2d2d2d;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
        }
        #suggestions li:hover { background-color: #2d2d2d; }
        #compass-container {
            width: 280px;
            height: 280px;
            position: relative;
            margin-top: 60px;
        }
        #arrow {
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease-out;
        }
        #distance-display {
            font-size: 36px;
            font-weight: bold;
            color: #00adb5;
            margin-top: 20px;
        }
        #info {
            margin-top: 10px;
            font-size: 13px;
            color: #aaaaaa;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>Navigatore GPS Freccia</h2>
        <p>Per funzionare, l'applicazione deve accedere al GPS e alla bussola del telefono.</p>
        <button class="btn-main" onclick="inizializzaNavigatore()">AVVIA NAVIGATORE</button>
    </div>

    <div id="search-container">
        <div class="search-row">
            <input type="text" id="search-input" placeholder="Cerca una destinazione...">
            <button class="btn-search" onclick="searchPlace()">Cerca</button>
        </div>
        <ul id="suggestions"></ul>
    </div>

    <div id="compass-container">
        <svg id="arrow" viewBox="0 0 100 100">
            <polygon points="50,5 95,95 50,75 5,95" fill="#00adb5" />
        </svg>
    </div>

    <div id="distance-display">-- km</div>
    <div id="info">Cerca un posto per iniziare.</div>

    <script>
        let destLat = null, destLon = null;
        let currentLat = null, currentLon = null;
        let deviceHeading = 0;

        function inizializzaNavigatore() {
            // Sblocco Bussola (iOS e Android)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            attivaSensoriOrientamento();
                        } else {
                            alert("Permesso bussola negato. La freccia non girerà.");
                        }
                    }).catch(console.error);
            } else {
                attivaSensoriOrientamento();
            }

            // Sblocco GPS
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        updateNavigation();
                    },
                    (err) => { alert("Errore GPS: " + err.message); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else {
                alert("GPS non supportato dal browser.");
            }

            // Nascondi la schermata di sblocco
            document.getElementById('start-screen').style.display = 'none';
        }

        function attivaSensoriOrientamento() {
            const handleOrientation = (event) => {
                if (event.webkitCompassHeading) {
                    deviceHeading = event.webkitCompassHeading; // iOS
                } else if (event.alpha) {
                    deviceHeading = 360 - event.alpha; // Android
                }
                updateNavigation();
            };
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        async function searchPlace() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
            try {
                const response = await fetch(url, { headers: { 'User-Agent': 'MinimalGPS/1.0' } });
                const data = await response.json();
                const suggestionsUl = document.getElementById('suggestions');
                suggestionsUl.innerHTML = '';
                
                if (data.length === 0) {
                    alert("Nessun posto trovato.");
                    return;
                }

                suggestionsUl.style.display = 'block';
                data.forEach(place => {
                    const li = document.createElement('li
