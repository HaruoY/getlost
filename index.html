<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Navigatore</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #121212; color: white; font-family: sans-serif; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #00adb5; }
        .error { border-left-color: #ff5252; color: #ff8686; }
        .success { border-left-color: #4caf50; color: #81c784; }
        button { width: 100%; padding: 15px; background: #00adb5; border: none; color: white; font-size: 16px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
        #arrow-box { display: flex; justify-content: center; margin: 20px 0; }
        svg { width: 150px; height: 150px; transition: transform 0.1s; }
    </style>
</head>
<body>

    <h2>Pannello di Controllo GPS</h2>
    <p>Usa questa pagina per capire cosa sta bloccando il telefono.</p>

    <button onclick="attivaSensori()">1. PREMI QUI PER ATTIVARE I SENSORI</button>

    <div id="status-gps" class="box error">GPS: In attesa di segnale (Sei al chiuso?)...</div>
    <div id="status-bussola" class="box error">BUSSOLA: Non attiva (Clicca il pulsante sopra)</div>
    
    <div class="box">
        <strong>Coordinate Ricevute:</strong> <span id="debug-coords">Nessuna</span><br>
        <strong>Orientamento Telefono:</strong> <span id="debug-bussola">0°</span>
    </div>

    <div id="arrow-box">
        <svg id="arrow" viewBox="0 0 100 100">
            <polygon points="50,5 95,95 50,75 5,95" fill="#00adb5" />
        </svg>
    </div>

    <script>
        let gpsAttivo = false;

        function attivaSensori() {
            // Test Bussola
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            avviaBussola();
                        } else {
                            document.getElementById('status-bussola').className = "box error";
                            document.getElementById('status-bussola').innerText = "BUSSOLA: Permesso negato dall'utente.";
                        }
                    }).catch(err => {
                        document.getElementById('status-bussola').innerText = "Errore Bussola: " + err;
                    });
            } else {
                avviaBussola();
            }

            // Test GPS
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        document.getElementById('status-gps').className = "box success";
                        document.getElementById('status-gps').innerText = "GPS: Funzionante e Preciso!";
                        document.getElementById('debug-coords').innerText = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                    },
                    (err) => {
                        document.getElementById('status-gps').className = "box error";
                        document.getElementById('status-gps').innerText = `ERRORE GPS (${err.code}): ${err.message}`;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                document.getElementById('status-gps').innerText = "GPS: Non supportato dal browser.";
            }
        }

        function avviaBussola() {
            const handle = (e) => {
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if(heading) {
                    document.getElementById('status-bussola').className = "box success";
                    document.getElementById('status-bussola').innerText = "BUSSOLA: Funzionante!";
                    document.getElementById('debug-bussola').innerText = heading.toFixed(1) + "°";
                    document.getElementById('arrow').style.transform = `rotate(${-heading}deg)`;
                }
            };
            window.addEventListener('deviceorientationabsolute', handle, true);
            window.addEventListener('deviceorientation', handle, true);
        }
    </script>
</body>
</html>
