<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigatore GPS Automatico</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .btn-main {
            padding: 20px 40px; background-color: #00adb5; color: white;
            border: none; border-radius: 50px; font-size: 18px; cursor: pointer; font-weight: bold;
        }
        #nav-interface {
            display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 400px;
        }
        .input-box {
            width: 100%; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;
        }
        input {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            background-color: #1e1e1e; color: white; font-size: 15px; box-sizing: border-box;
        }
        .btn-action {
            width: 100%; padding: 14px; background-color: #00adb5; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #compass-container {
            width: 260px; height: 260px; position: relative; margin: 25px 0;
        }
        #arrow {
            width: 100%; height: 100%; transition: transform 0.1s ease-out;
        }
        #distance-display {
            font-size: 42px; font-weight: bold; color: #00adb5; margin-bottom: 5px;
        }
        #status-log {
            font-size: 12px; color: #888; text-align: center; max-width: 90%; margin-top: 15px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2>Navigatore Smart GPS</h2>
        <p>Incolla un link di Google Maps per importare la posizione esatta.</p>
        <button class="btn-main" onclick="inizializzaNavigatore()">ATTIVA SENSORI</button>
    </div>

    <div id="nav-interface">
        <div class="input-box">
            <input type="text" id="maps-url" placeholder="Incolla qui il link di Google Maps...">
            <button class="btn-action" onclick="importaDaLink()">IMPORTA POSIZIONE</button>
        </div>

        <div id="compass-container">
            <svg id="arrow" viewBox="0 0 100 100">
                <polygon points="50,5 95,95 50,75 5,95" fill="#00adb5" />
            </svg>
        </div>

        <div id="distance-display">-- m</div>
        <div id="status-log">In attesa del link della destinazione...</div>
    </div>

    <script>
        let destLat = null, destLon = null;
        let currentLat = null, currentLon = null;
        let deviceHeading = 0;

        function aggiornaLog(testo) {
            document.getElementById('status-log').innerText = testo;
        }

        function inizializzaNavigatore() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') attivaBussola();
                }).catch(err => alert(err));
            } else {
                attivaBussola();
            }

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        let acc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : "?";
                        aggiornaLog(`GPS Attivo (Precisione: +/- ${acc}m)`);
                        updateNavigation();
                    },
                    (err) => { aggiornaLog(`Errore GPS: ${err.message}`); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
                );
            }
            document.getElementById('start-screen').style.display = 'none';
        }

        function attivaBussola() {
            const handleOrientation = (event) => {
                deviceHeading = event.webkitCompassHeading || (360 - event.alpha) || 0;
                updateNavigation();
            };
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        // FUNZIONE DI ESTRAZIONE AUTOMATICA DELLE COORDINATE
        function importaDaLink() {
            const urlInput = document.getElementById('maps-url').value;
            
            // Cerca pattern di coordinate classici nei link di Google Maps (es: @41.8902,12.4922 o query=41.8902,12.4922)
            const regex = /@(-?\d+\.\d+),(-?\d+\.\d+)/;
            const regexQuery = /q=(-?\d+\.\d+),(-?\d+\.\d+)/;
            
            let match = urlInput.match(regex) || urlInput.match(regexQuery);

            // Se l'utente incolla direttamente solo le coordinate separate da virgola senza link
            if (!match) {
                const directMatch = urlInput.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
                if (directMatch) match = directMatch;
            }

            if (match) {
                destLat = parseFloat(match[1]);
                destLon = parseFloat(match[2]);
                aggiornaLog(`Meta importata con successo!\nLat: ${destLat.toFixed(5)} | Lon: ${destLon.toFixed(5)}`);
                updateNavigation();
            } else {
                alert("Non sono riuscito a trovare le coordinate in questo testo. Assicurati che ci siano i numeri decimali separati da una virgola o un link valido.");
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180; lat2 = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function updateNavigation() {
            if (currentLat === null || currentLon === null || destLat === null || destLon === null) return;

            const distance = calculateDistance(currentLat, currentLon, destLat, destLon);
            document.getElementById('distance-display').textContent = distance < 1 ? `${(distance * 1000).toFixed(0)} m` : `${distance.toFixed(2)} km`;

            const targetBearing = calculateBearing(currentLat, currentLon, destLat, destLon);
            document.getElementById('arrow').style.transform = `rotate(${targetBearing - deviceHeading}deg)`;
        }
    </script>
</body>
</html>
